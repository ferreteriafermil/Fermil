name: Sincronizar con PLADE

on:
  schedule:
    # Cada 2 horas de 7:00 a. m. a 7:00 p. m., hora de Venezuela (UTC-4)
    - cron: '0 11-23/2 * * *'
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ['web/**', 'nube.json', 'robot/**', '.github/workflows/**']

concurrency:
  group: sincronizar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PROYECTO: ${{ vars.PROYECTO_CLOUDFLARE || 'ferreteria-fermil' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar lo que usa el robot
        run: pip install requests openpyxl pillow

      - name: Traer precios, existencias y tasa de PLADE
        env:
          PLADE_URL: ${{ secrets.PLADE_URL }}
          PLADE_USUARIO: ${{ secrets.PLADE_USUARIO }}
          PLADE_CLAVE: ${{ secrets.PLADE_CLAVE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: python robot/sync.py

      - name: Armar la página
        run: python web/build.py --nube nube.json --catalogo salida/catalogo.json --fotos-cache fotos_cache.json --fotos-dir fotos --salida _site

      - name: Publicar la página en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash web/publicar.sh

      - name: Buscar fotos nuevas en PLADE
        continue-on-error: true
        env:
          PLADE_URL: ${{ secrets.PLADE_URL }}
          PLADE_USUARIO: ${{ secrets.PLADE_USUARIO }}
          PLADE_CLAVE: ${{ secrets.PLADE_CLAVE }}
        run: python robot/sync.py fotos

      - name: Publicar otra vez con las fotos nuevas
        if: hashFiles('salida/fotos_nuevas') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python web/build.py --nube nube.json --catalogo salida/catalogo.json --fotos-cache fotos_cache.json --fotos-dir fotos --salida _site
          bash web/publicar.sh

      - name: Guardar las fotos nuevas en el repositorio
        if: always()
        run: |
          git config user.name "Robot Fermil"
          git config user.email "robot-fermil@users.noreply.github.com"
          git add fotos fotos_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin fotos nuevas"; else
            git commit -m "Fotos nuevas de PLADE $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          fi
